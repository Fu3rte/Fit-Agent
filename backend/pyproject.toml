[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fu3rte", email = "2575716528@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "openai>=3,<4",
    "pydantic>=2,<3",
    "python-dotenv>=1,<2",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "anyio>=4",
    "anthropic>=0.49,<1",
    "httpx>=0.28,<1",
    "aiosqlite>=0.22.1",
    "jsonschema>=4",
    "jsonpointer>=3,<4",
]

# 源码以 backend/ 下的 app namespace package 直接导入。
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.ruff]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
norecursedirs = ["archive"]  # 归档的 pi 移植残留不参与收集
anyio_mode = "auto"  # 全部协程测试函数交给 anyio 插件；后端固定 asyncio
