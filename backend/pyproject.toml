[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Fu3rte", email = "2575716528@qq.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "aiosqlite>=0.21",
    "platformdirs>=4.3",
    "tzlocal>=5",
    "tzdata>=2024.1",
    "langchain>=1,<2",
    "langchain-openai>=1,<2",
    "langchain-anthropic>=0.3",
    "langgraph>=1,<2",
    "langgraph-checkpoint-sqlite>=3,<4",
]

# 源码以 backend/ 下的顶层模块直接导入，不构建 Python 包。
[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.16",
]

[tool.ruff]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
norecursedirs = ["archive"]  # 归档的 pi 移植残留不参与收集
anyio_mode = "auto"  # 全部协程测试函数交给 anyio 插件；后端固定 asyncio
